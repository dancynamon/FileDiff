<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FileDiff</title>
<style>
  :root {
    --bg-equal: #ffffff;
    --bg-delete: #ffd6d6;
    --bg-insert: #d6ffd6;
    --bg-replace: #ffe9b0;
    --bg-pad: #ececec;
    --fg-pad: #bbbbbb;
    --bg-hunk: #fff5b8;
    --border-hunk: #c9b85c;
    --arrow-right: #0a66c2;
    --arrow-left: #c2660a;
    --line-height: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, sans-serif;
    color: #222;
  }
  header.toolbar {
    background: #2d2d30; color: #f0f0f0;
    padding: 6px 10px;
    display: flex; gap: 6px; align-items: center;
    flex-shrink: 0;
  }
  header.toolbar button {
    background: #3c3c3c; color: #f0f0f0;
    border: 1px solid #555; border-radius: 4px;
    padding: 5px 10px; cursor: pointer; font-size: 13px;
  }
  header.toolbar button:hover { background: #4a4a4a; }
  header.toolbar .spacer { flex: 1; }
  header.toolbar .title { font-weight: 600; margin-right: 12px; }
  .menu-wrap { position: relative; }
  .menu {
    display: none; position: absolute; top: 100%; left: 0;
    background: #3c3c3c; border: 1px solid #555;
    border-radius: 4px; min-width: 140px; z-index: 100;
    padding: 4px 0; margin-top: 2px;
  }
  .menu.open { display: flex; flex-direction: column; }
  .menu button {
    background: transparent; border: none; border-radius: 0;
    text-align: left; padding: 6px 12px; font-size: 13px;
    color: #f0f0f0; cursor: pointer;
  }
  .menu button:hover { background: #4a4a4a; }
  .filelist {
    background: #fafafa; border-bottom: 1px solid #ccc;
    max-height: 35vh; overflow-y: auto; flex-shrink: 0;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
  }
  .filelist.hidden { display: none; }
  .filelist-header {
    padding: 4px 10px; background: #ececec;
    border-bottom: 1px solid #ddd;
    display: flex; gap: 12px; align-items: center;
    font-size: 12px; position: sticky; top: 0; z-index: 1;
  }
  .filelist-header label { cursor: pointer; }
  .filelist-counts { color: #666; font-size: 11px; }
  .file-row {
    padding: 3px 10px; cursor: pointer;
    display: flex; gap: 8px; align-items: center;
    border-bottom: 1px solid #f0f0f0;
  }
  .file-row:hover { background: #e8f0fe; }
  .file-row.selected { background: #cfe1ff; }
  .file-row .file-path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row .status-label {
    color: #666; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .file-row .status-icon { width: 14px; text-align: center; font-weight: 700; }
  .file-row.status-identical            { color: #666; }
  .file-row.status-identical .status-icon { color: #999; }
  .file-row.status-differs              { background: rgba(255, 233, 176, 0.55); }
  .file-row.status-differs .status-icon { color: #a76f00; }
  .file-row.status-only-left            { background: rgba(255, 214, 214, 0.55); }
  .file-row.status-only-left .status-icon { color: #b21f1f; }
  .file-row.status-only-right           { background: rgba(214, 255, 214, 0.55); }
  .file-row.status-only-right .status-icon { color: #1f8d1f; }
  .file-row.status-moved                { background: rgba(176, 200, 255, 0.45); }
  .file-row.status-moved .status-icon   { color: #0a3a8c; }
  .file-row .moved-paths { flex: 1; overflow: hidden; }
  .file-row .moved-paths .arrow-sep { color: #999; padding: 0 6px; }
  .file-row.selected.status-differs,
  .file-row.selected.status-only-left,
  .file-row.selected.status-only-right { background: #cfe1ff; }
  .filelist-empty { padding: 12px; color: #888; font-style: italic; }
  .binary-notice {
    padding: 32px 20px; text-align: center; color: #555;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px; line-height: 1.6;
  }
  .binary-notice strong {
    font-size: 14px; color: #333;
    display: block; margin-bottom: 6px;
  }
  .binary-notice em { color: #888; font-style: normal; }
  .paths {
    display: flex; background: #d6d6d6;
    border-bottom: 1px solid #aaa; flex-shrink: 0;
  }
  .path {
    flex: 1; padding: 4px 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .path:first-child { border-right: 60px solid #c4c4c4; }
  .container {
    flex: 1;
    display: flex; min-height: 0;
    border-top: 1px solid #ccc;
  }
  .pane {
    flex: 1; min-width: 0;
    overflow: auto;
    background: #fff;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: var(--line-height);
  }
  .pane .inner { white-space: pre; min-width: 100%; }
  .line { display: flex; min-height: var(--line-height); }
  .lineno {
    width: 44px; flex-shrink: 0;
    color: #888; text-align: right; padding-right: 8px;
    user-select: none; background: #f7f7f7;
    border-right: 1px solid #e0e0e0;
  }
  .content { padding: 0 6px; flex: 1; }
  .line.equal   { background: var(--bg-equal); }
  .line.delete  { background: var(--bg-delete); }
  .line.insert  { background: var(--bg-insert); }
  .line.replace { background: var(--bg-replace); }
  .line.pad     { background: var(--bg-pad); color: var(--fg-pad); }
  .line.pad .lineno { background: #e4e4e4; color: #bbb; }
  .gutter {
    width: 60px; flex-shrink: 0;
    background: #f4f4f4;
    overflow: hidden; position: relative;
    border-left: 1px solid #ccc; border-right: 1px solid #ccc;
  }
  .gutter .scroller { position: relative; }
  .hunk-marker {
    position: absolute; left: 3px; right: 3px;
    background: var(--bg-hunk);
    border: 1px solid var(--border-hunk);
    border-radius: 3px;
    display: flex; align-items: center; justify-content: space-around;
  }
  .arrow {
    cursor: pointer; font-weight: 700; font-size: 16px;
    user-select: none; line-height: 1;
    padding: 0 4px;
  }
  .arrow.right { color: var(--arrow-right); }
  .arrow.left  { color: var(--arrow-left); }
  .arrow:hover { transform: scale(1.2); }
  .status {
    flex-shrink: 0;
    background: #eee; border-top: 1px solid #ccc;
    padding: 4px 10px; font-size: 12px; color: #444;
  }
  .drop-overlay {
    position: fixed; inset: 0;
    background: rgba(10, 102, 194, 0.15);
    border: 4px dashed #0a66c2;
    display: none; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 600; color: #0a66c2;
    pointer-events: none; z-index: 1000;
  }
  .drop-overlay.show { display: flex; }
</style>
</head>
<body>
<header class="toolbar">
  <span class="title">FileDiff</span>
  <div class="menu-wrap">
    <button id="openLeftBtn" data-menu="openLeftMenu">Open Left ▾</button>
    <div class="menu" id="openLeftMenu">
      <button data-side="left" data-kind="file">File…</button>
      <button data-side="left" data-kind="folder">Folder…</button>
    </div>
  </div>
  <div class="menu-wrap">
    <button id="openRightBtn" data-menu="openRightMenu">Open Right ▾</button>
    <div class="menu" id="openRightMenu">
      <button data-side="right" data-kind="file">File…</button>
      <button data-side="right" data-kind="folder">Folder…</button>
    </div>
  </div>
  <button id="refresh">Refresh</button>
  <button id="prevDiff" title="Previous diff (Shift+F8)">← Prev</button>
  <button id="nextDiff" title="Next diff (F8)">Next →</button>
  <span class="spacer"></span>
  <button id="saveLeft">Save Left</button>
  <button id="saveRight">Save Right</button>
</header>
<div class="paths">
  <div id="leftPath" class="path">(no file)</div>
  <div id="rightPath" class="path">(no file)</div>
</div>
<div class="filelist hidden" id="filelist">
  <div class="filelist-header">
    <strong>Files</strong>
    <span class="filelist-counts" id="filelistCounts"></span>
    <span style="flex:1"></span>
    <label><input type="checkbox" id="filterDiffsOnly" checked> Differences only</label>
    <label title="Hash unmatched files on both sides and pair them by content (finds moved/renamed files)">
      <input type="checkbox" id="crossMatchToggle"> Match content across paths
    </label>
    <button id="closeFolderMode" style="background:#bbb; color:#222; border:1px solid #999; border-radius:3px; padding:2px 8px; font-size:11px; cursor:pointer;">Close folder mode</button>
  </div>
  <div id="filelistRows"></div>
</div>
<div class="container">
  <div class="pane" id="leftPane"><div class="inner" id="leftInner"></div></div>
  <div class="gutter" id="gutter"><div class="scroller" id="gutterInner"></div></div>
  <div class="pane" id="rightPane"><div class="inner" id="rightInner"></div></div>
</div>
<div class="status" id="status">Open two files or two folders to begin. Tip: drag &amp; drop files anywhere.</div>
<div class="drop-overlay" id="dropOverlay">Drop two files or two folders</div>

<script>
"use strict";

const LINE_HEIGHT = 18;

const state = {
  left:  { name: null, lines: [], trailingNL: true, handle: null,
           dirHandle: null, dirName: null, fileMap: null,
           binary: false, binarySize: 0, oversized: false, missing: false,
         },
  right: { name: null, lines: [], trailingNL: true, handle: null,
           dirHandle: null, dirName: null, fileMap: null,
           binary: false, binarySize: 0, oversized: false, missing: false,
         },
  hunks: [],
  syncing: false,
  folderEntries: [],
  currentPath: null,
};

const TEXT_LIMIT = 5 * 1024 * 1024;  // bigger than this → treat as binary

function detectBinary(u8) {
  const n = Math.min(u8.length, 4096);
  if (n === 0) return false;
  let nonPrint = 0;
  for (let i = 0; i < n; i++) {
    const c = u8[i];
    if (c === 0) return true;                      // NUL byte → binary
    if (c < 9 || (c > 13 && c < 32) || c === 127) nonPrint++;
  }
  return nonPrint / n > 0.30;
}

// ----- DOM refs -----
const leftPane = document.getElementById("leftPane");
const rightPane = document.getElementById("rightPane");
const leftInner = document.getElementById("leftInner");
const rightInner = document.getElementById("rightInner");
const gutter = document.getElementById("gutter");
const gutterInner = document.getElementById("gutterInner");
const statusBar = document.getElementById("status");
const leftPathEl = document.getElementById("leftPath");
const rightPathEl = document.getElementById("rightPath");
const dropOverlay = document.getElementById("dropOverlay");
const filelistEl = document.getElementById("filelist");
const filelistRows = document.getElementById("filelistRows");
const filelistCounts = document.getElementById("filelistCounts");
const filterDiffsOnly = document.getElementById("filterDiffsOnly");
const crossMatchToggle = document.getElementById("crossMatchToggle");

// ----- Diff algorithm: LCS DP -> matching blocks -> opcodes ----------
function matchingBlocks(a, b) {
  const n = a.length, m = b.length;
  if (n === 0 || m === 0) return [[n, m, 0]];

  // Use a 1D rolling array to save memory.
  let prev = new Int32Array(m + 1);
  let curr = new Int32Array(m + 1);
  // We need the full table for backtracking. Allocate full DP only if small
  // enough; otherwise warn and bail to a coarse single-block opcode.
  const cells = (n + 1) * (m + 1);
  if (cells > 16_000_000) {
    return [[0, 0, 0], [n, m, 0]];
  }
  const dp = new Int32Array(cells);
  const W = m + 1;
  for (let i = 1; i <= n; i++) {
    const ai = a[i - 1];
    const rowPrev = (i - 1) * W;
    const row = i * W;
    for (let j = 1; j <= m; j++) {
      if (ai === b[j - 1]) {
        dp[row + j] = dp[rowPrev + j - 1] + 1;
      } else {
        const up = dp[rowPrev + j];
        const left = dp[row + j - 1];
        dp[row + j] = up >= left ? up : left;
      }
    }
  }

  const blocks = [];
  let i = n, j = m, cur = null;
  while (i > 0 && j > 0) {
    if (a[i - 1] === b[j - 1]) {
      if (cur && cur[0] === i && cur[1] === j) {
        cur[0] = i - 1; cur[1] = j - 1; cur[2]++;
      } else {
        if (cur) blocks.push(cur);
        cur = [i - 1, j - 1, 1];
      }
      i--; j--;
    } else if (dp[(i - 1) * W + j] >= dp[i * W + (j - 1)]) {
      if (cur) { blocks.push(cur); cur = null; }
      i--;
    } else {
      if (cur) { blocks.push(cur); cur = null; }
      j--;
    }
  }
  if (cur) blocks.push(cur);
  blocks.reverse();
  blocks.push([n, m, 0]);
  return blocks;
}

function getOpcodes(a, b) {
  const blocks = matchingBlocks(a, b);
  const ops = [];
  let i = 0, j = 0;
  for (const [ai, bj, size] of blocks) {
    if (ai > i && bj > j)      ops.push(["replace", i, ai, j, bj]);
    else if (ai > i)           ops.push(["delete",  i, ai, j, bj]);
    else if (bj > j)           ops.push(["insert",  i, ai, j, bj]);
    if (size) ops.push(["equal", ai, ai + size, bj, bj + size]);
    i = ai + size; j = bj + size;
  }
  return ops;
}

// ----- Rendering -----
function escapeHTML(s) {
  return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderBinaryView() {
  function panel(s) {
    if (s.missing) {
      return `<div class="binary-notice">(missing on this side)</div>`;
    }
    if (s.binary) {
      const sz = (s.binarySize || 0).toLocaleString();
      const tag = s.oversized ? "Large file" : "Binary file";
      const sub = s.oversized
        ? "Text diff suppressed for files over 5 MB."
        : "Not displayable as text.";
      return `<div class="binary-notice"><strong>${tag}</strong>${sz} bytes<br><em>${sub}</em></div>`;
    }
    return `<div class="binary-notice"><strong>Text file</strong>${s.lines.length} lines<br><em>Other side is binary; diff suppressed.</em></div>`;
  }
  leftInner.innerHTML = panel(state.left);
  rightInner.innerHTML = panel(state.right);
  state.hunks = [];
  gutterInner.innerHTML = "";
  gutterInner.style.height = "0px";
  if (state.left.binary && state.right.binary) {
    statusBar.textContent = "Binary files — text diff not available.";
  } else if (state.left.binary || state.right.binary) {
    statusBar.textContent = "One side is binary — text diff not available.";
  }
}

function recompute() {
  if (state.left.binary || state.right.binary) {
    renderBinaryView();
    return;
  }
  const a = state.left.lines, b = state.right.lines;
  const ops = getOpcodes(a, b);

  const leftRows = [];
  const rightRows = [];
  state.hunks = [];

  let displayRow = 0; // 0-based row index

  for (const [tag, i1, i2, j1, j2] of ops) {
    const leftChunk = a.slice(i1, i2);
    const rightChunk = b.slice(j1, j2);
    const n = Math.max(leftChunk.length, rightChunk.length);
    if (n === 0) continue;

    const displayStart = displayRow;

    for (let k = 0; k < n; k++) {
      const hasL = k < leftChunk.length;
      const hasR = k < rightChunk.length;
      const lineTag = tag;

      const lClass = !hasL ? "pad"
        : (tag === "equal" ? "equal"
          : tag === "delete" ? "delete"
          : tag === "insert" ? "pad"
          : "replace");
      const rClass = !hasR ? "pad"
        : (tag === "equal" ? "equal"
          : tag === "insert" ? "insert"
          : tag === "delete" ? "pad"
          : "replace");

      const lLineNum = hasL ? (i1 + k + 1) : "";
      const rLineNum = hasR ? (j1 + k + 1) : "";

      leftRows.push(
        `<div class="line ${lClass}"><span class="lineno">${lLineNum}</span>` +
        `<span class="content">${hasL ? escapeHTML(leftChunk[k]) : ""}</span></div>`
      );
      rightRows.push(
        `<div class="line ${rClass}"><span class="lineno">${rLineNum}</span>` +
        `<span class="content">${hasR ? escapeHTML(rightChunk[k]) : ""}</span></div>`
      );
      displayRow++;
    }

    if (tag !== "equal") {
      state.hunks.push({
        tag, i1, i2, j1, j2,
        displayStart,
        displayEnd: displayRow,
      });
    }
  }

  leftInner.innerHTML = leftRows.join("");
  rightInner.innerHTML = rightRows.join("");

  const totalH = displayRow * LINE_HEIGHT;
  gutterInner.style.height = totalH + "px";
  renderGutter();

  const n = state.hunks.length;
  if (a.length === 0 && b.length === 0) {
    statusBar.textContent = "Open two files to begin. Tip: drag & drop files.";
  } else if (n === 0) {
    statusBar.textContent = "Files are identical.";
  } else {
    statusBar.textContent =
      `${n} difference${n === 1 ? "" : "s"}. ` +
      `Click → to push left into right, ← to push right into left.`;
  }
}

function renderGutter() {
  const html = state.hunks.map((h, idx) => {
    const top = h.displayStart * LINE_HEIGHT;
    const height = (h.displayEnd - h.displayStart) * LINE_HEIGHT;
    return `<div class="hunk-marker" style="top:${top}px;height:${height}px">
      <span class="arrow right" data-idx="${idx}" data-dir="r" title="Push left into right">→</span>
      <span class="arrow left"  data-idx="${idx}" data-dir="l" title="Push right into left">←</span>
    </div>`;
  }).join("");
  gutterInner.innerHTML = html;
}

// ----- Merge actions -----
function mergeToRight(idx) {
  if (state.left.binary || state.right.binary) return;
  const h = state.hunks[idx];
  if (!h) return;
  const repl = state.left.lines.slice(h.i1, h.i2);
  state.right.lines = state.right.lines.slice(0, h.j1)
    .concat(repl, state.right.lines.slice(h.j2));
  recompute();
}
function mergeToLeft(idx) {
  if (state.left.binary || state.right.binary) return;
  const h = state.hunks[idx];
  if (!h) return;
  const repl = state.right.lines.slice(h.j1, h.j2);
  state.left.lines = state.left.lines.slice(0, h.i1)
    .concat(repl, state.left.lines.slice(h.i2));
  recompute();
}

gutterInner.addEventListener("click", (e) => {
  const t = e.target;
  if (!t.classList.contains("arrow")) return;
  const idx = parseInt(t.dataset.idx, 10);
  if (t.dataset.dir === "r") mergeToRight(idx);
  else mergeToLeft(idx);
});

// ----- Scroll sync -----
function syncScroll(source) {
  if (state.syncing) return;
  state.syncing = true;
  const y = source.scrollTop;
  if (source !== leftPane) leftPane.scrollTop = y;
  if (source !== rightPane) rightPane.scrollTop = y;
  gutter.scrollTop = y;
  state.syncing = false;
}
leftPane.addEventListener("scroll", () => syncScroll(leftPane));
rightPane.addEventListener("scroll", () => syncScroll(rightPane));

// ----- Navigation -----
function jumpToHunk(idx) {
  if (idx < 0 || idx >= state.hunks.length) return;
  const y = state.hunks[idx].displayStart * LINE_HEIGHT;
  leftPane.scrollTop = y - 40;
}
function currentHunkIndex() {
  const y = leftPane.scrollTop;
  for (let i = 0; i < state.hunks.length; i++) {
    if (state.hunks[i].displayStart * LINE_HEIGHT >= y - 4) return i;
  }
  return -1;
}
document.getElementById("nextDiff").addEventListener("click", () => {
  if (!state.hunks.length) return;
  const cur = currentHunkIndex();
  const next = cur < 0 ? 0 : Math.min(cur + 1, state.hunks.length - 1);
  jumpToHunk(next);
});
document.getElementById("prevDiff").addEventListener("click", () => {
  if (!state.hunks.length) return;
  const cur = currentHunkIndex();
  const prev = cur < 0 ? state.hunks.length - 1 : Math.max(cur - 1, 0);
  jumpToHunk(prev);
});

// ----- File I/O -----
function parseContent(text) {
  const trailingNL = text.endsWith("\n") || text === "";
  return { lines: text.split(/\r?\n/).slice(0, trailingNL ? -1 : undefined), trailingNL };
}

async function readSideFile(side, fileOrHandle, displayName) {
  const file = fileOrHandle.getFile ? await fileOrHandle.getFile() : fileOrHandle;
  const s = state[side];
  s.name = displayName;
  s.missing = false;
  s.oversized = false;
  s.binary = false;
  s.binarySize = 0;
  if (file.size > TEXT_LIMIT) {
    s.binary = true; s.oversized = true; s.binarySize = file.size;
    s.lines = []; s.trailingNL = true;
    return;
  }
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf);
  if (detectBinary(u8)) {
    s.binary = true; s.binarySize = file.size;
    s.lines = []; s.trailingNL = true;
    return;
  }
  const text = new TextDecoder("utf-8", { fatal: false }).decode(buf);
  const parsed = parseContent(text);
  s.lines = parsed.lines;
  s.trailingNL = parsed.trailingNL;
}

function setMissingSide(side, displayName) {
  const s = state[side];
  s.name = displayName;
  s.lines = [];
  s.trailingNL = true;
  s.handle = null;
  s.binary = false;
  s.binarySize = 0;
  s.oversized = false;
  s.missing = true;
}

async function pickAndLoad(side) {
  exitFolderMode(side); // single-file open clears folder mode for that side
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({ multiple: false });
      state[side].handle = handle;
      const file = await handle.getFile();
      await readSideFile(side, handle, file.name);
      setPathLabel(side, file.name);
      maybeHideFilelist();
      recompute();
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
      console.warn(err);
    }
  }
  // Fallback: invisible file input
  const input = document.createElement("input");
  input.type = "file";
  input.addEventListener("change", async () => {
    const f = input.files[0];
    if (!f) return;
    state[side].handle = null;
    await readSideFile(side, f, f.name);
    setPathLabel(side, f.name);
    maybeHideFilelist();
    recompute();
  });
  input.click();
}

function setPathLabel(side, name) {
  const el = side === "left" ? leftPathEl : rightPathEl;
  el.textContent = name;
  el.title = name;
}

// ----- Folder I/O -----
async function pickAndLoadFolder(side) {
  if (window.showDirectoryPicker) {
    try {
      const dirHandle = await window.showDirectoryPicker();
      const fileMap = new Map();
      statusBar.textContent = `Walking ${side} folder…`;
      await walkFSADir(dirHandle, "", fileMap);
      state[side].dirHandle = dirHandle;
      state[side].dirName = dirHandle.name;
      state[side].fileMap = fileMap;
      setPathLabel(side, dirHandle.name + "/");
      await refreshFolderDiff();
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
      console.warn(err);
    }
  }
  // Fallback: webkitdirectory input (read-only — save will download)
  const input = document.createElement("input");
  input.type = "file";
  input.webkitdirectory = true;
  input.multiple = true;
  input.addEventListener("change", async () => {
    const files = Array.from(input.files);
    if (!files.length) return;
    const root = files[0].webkitRelativePath.split("/")[0];
    const fileMap = new Map();
    for (const f of files) {
      const rel = f.webkitRelativePath.split("/").slice(1).join("/");
      fileMap.set(rel, { file: f, relPath: rel });
    }
    state[side].dirHandle = null;
    state[side].dirName = root;
    state[side].fileMap = fileMap;
    setPathLabel(side, root + "/");
    await refreshFolderDiff();
  });
  input.click();
}

async function walkFSADir(dirHandle, prefix, out) {
  for await (const [name, h] of dirHandle.entries()) {
    if (name.startsWith(".")) continue; // skip hidden
    const path = prefix ? prefix + "/" + name : name;
    if (h.kind === "directory") {
      await walkFSADir(h, path, out);
    } else {
      out.set(path, { handle: h, relPath: path });
    }
    if (out.size > 20000) {
      throw new Error("folder has too many files (>20000)");
    }
  }
}

async function entryToFile(entry) {
  if (entry.handle) return entry.handle.getFile();
  return entry.file;
}

async function compareEntries(left, right) {
  if (!left) return "only-right";
  if (!right) return "only-left";
  const [lf, rf] = await Promise.all([entryToFile(left), entryToFile(right)]);
  if (lf.size !== rf.size) return "differs";
  if (lf.size === 0) return "identical";
  const [la, ra] = await Promise.all([lf.arrayBuffer(), rf.arrayBuffer()]);
  const la8 = new Uint8Array(la), ra8 = new Uint8Array(ra);
  for (let i = 0; i < la8.length; i++) {
    if (la8[i] !== ra8[i]) return "differs";
  }
  return "identical";
}

async function refreshFolderDiff() {
  const L = state.left.fileMap, R = state.right.fileMap;
  if (!L && !R) return;
  filelistEl.classList.remove("hidden");
  const paths = new Set();
  if (L) for (const k of L.keys()) paths.add(k);
  if (R) for (const k of R.keys()) paths.add(k);
  const sorted = [...paths].sort();
  statusBar.textContent = `Comparing ${sorted.length} paths…`;

  const entries = [];
  const counts = { identical: 0, differs: 0, "only-left": 0, "only-right": 0, moved: 0 };

  const CONCURRENCY = 8;
  let idx = 0;
  async function worker() {
    while (idx < sorted.length) {
      const my = idx++;
      const path = sorted[my];
      const le = L ? L.get(path) : null;
      const re = R ? R.get(path) : null;
      let status, leftPath = null, rightPath = null;
      if (le && re) {
        try { status = await compareEntries(le, re); }
        catch { status = "differs"; }
        leftPath = path; rightPath = path;
      } else if (le) {
        status = "only-left";  leftPath = path;
      } else {
        status = "only-right"; rightPath = path;
      }
      entries[my] = { path, leftPath, rightPath, status, leftEntry: le, rightEntry: re };
      counts[status]++;
    }
  }
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));

  state.folderEntries = entries;

  if (crossMatchToggle.checked) {
    await crossMatchByContent(counts);
  }

  renderFileList(counts);
  const msg = `${counts.identical} identical, ${counts.differs} differ, ` +
    (counts.moved ? `${counts.moved} moved/renamed, ` : "") +
    `${counts["only-left"]} only left, ${counts["only-right"]} only right. ` +
    `Click a file to view its diff.`;
  statusBar.textContent = msg;
}

// ----- Cross-path content matching (find moved/renamed files) -----
async function hashEntry(entry) {
  if (entry._hash) return entry._hash;
  const file = await entryToFile(entry);
  if (file.size === 0) {
    entry._hash = "empty";
    entry._size = 0;
    return entry._hash;
  }
  if (file.size > 256 * 1024 * 1024) {
    entry._hash = null;
    entry._size = file.size;
    return null;
  }
  const buf = await file.arrayBuffer();
  const digest = await crypto.subtle.digest("SHA-1", buf);
  const u8 = new Uint8Array(digest);
  let hex = "";
  for (let i = 0; i < u8.length; i++) hex += u8[i].toString(16).padStart(2, "0");
  entry._hash = hex;
  entry._size = file.size;
  return hex;
}

async function entrySize(entry) {
  if (entry._size != null) return entry._size;
  const file = await entryToFile(entry);
  entry._size = file.size;
  return entry._size;
}

async function crossMatchByContent(counts) {
  const onlyLeft  = state.folderEntries.filter(e => e.status === "only-left");
  const onlyRight = state.folderEntries.filter(e => e.status === "only-right");
  if (!onlyLeft.length || !onlyRight.length) return;

  // Phase A: size bucketing. Files with no size-match on the other side
  // cannot be content-matched — skip them to avoid pointless hashing.
  statusBar.textContent = `Cross-path match: bucketing ${onlyLeft.length + onlyRight.length} files by size…`;
  const leftBySize = new Map();
  for (const e of onlyLeft) {
    const sz = await entrySize(e.leftEntry);
    if (!leftBySize.has(sz)) leftBySize.set(sz, []);
    leftBySize.get(sz).push(e);
  }
  const rightBySize = new Map();
  for (const e of onlyRight) {
    const sz = await entrySize(e.rightEntry);
    if (!rightBySize.has(sz)) rightBySize.set(sz, []);
    rightBySize.get(sz).push(e);
  }

  // Phase B: for sizes present on both sides, hash and pair.
  let toHash = 0;
  for (const [sz, ls] of leftBySize) {
    if (rightBySize.has(sz)) toHash += ls.length + rightBySize.get(sz).length;
  }
  if (toHash === 0) return;

  statusBar.textContent = `Cross-path match: hashing ${toHash} candidate files…`;

  let moved = 0;
  for (const [sz, ls] of leftBySize) {
    const rs = rightBySize.get(sz);
    if (!rs) continue;
    // Hash both side's candidates of this size
    await Promise.all(ls.map(e => hashEntry(e.leftEntry)));
    await Promise.all(rs.map(e => hashEntry(e.rightEntry)));

    // Index left by hash
    const leftPool = new Map();
    for (const e of ls) {
      const h = e.leftEntry._hash;
      if (!h) continue;
      if (!leftPool.has(h)) leftPool.set(h, []);
      leftPool.get(h).push(e);
    }
    // Greedy pair right entries against the pool
    for (const re of rs) {
      const h = re.rightEntry._hash;
      if (!h) continue;
      const bucket = leftPool.get(h);
      if (!bucket || !bucket.length) continue;
      const le = bucket.shift();
      // Mutate the right entry to a "moved" pair, mark the left for removal.
      re.status = "moved";
      re.leftEntry = le.leftEntry;
      re.leftPath = le.leftPath;
      le.status = "_paired";
      moved++;
    }
  }

  if (moved) {
    state.folderEntries = state.folderEntries.filter(e => e.status !== "_paired");
    counts.moved = (counts.moved || 0) + moved;
    counts["only-left"]  -= moved;
    counts["only-right"] -= moved;
  }
}

function renderFileList(counts) {
  const onlyDiffs = filterDiffsOnly.checked;
  const rows = state.folderEntries
    .filter(e => !onlyDiffs || e.status !== "identical")
    .map(e => {
      const icon = e.status === "identical" ? "="
                 : e.status === "differs"   ? "≠"
                 : e.status === "only-left" ? "←"
                 : e.status === "moved"     ? "⇄"
                 : "→";
      const sel = state.currentPath === e.path ? " selected" : "";
      const id  = escapeHTML(e.path);
      const body = e.status === "moved"
        ? `<span class="moved-paths">
             ${escapeHTML(e.leftPath)}
             <span class="arrow-sep">↦</span>
             ${escapeHTML(e.rightPath)}
           </span>`
        : `<span class="file-path">${escapeHTML(e.path)}</span>`;
      const label = e.status === "moved" ? "moved" : e.status.replace("-", " ");
      return `<div class="file-row status-${e.status}${sel}" data-path="${id}">
        <span class="status-icon">${icon}</span>
        ${body}
        <span class="status-label">${label}</span>
      </div>`;
    }).join("");
  filelistRows.innerHTML = rows ||
    `<div class="filelist-empty">No ${onlyDiffs ? "differing " : ""}files.</div>`;
  if (counts) {
    let txt = `${counts.identical}= / ${counts.differs}≠ / ` +
              `${counts["only-left"]}← / ${counts["only-right"]}→`;
    if (counts.moved) txt += ` / ${counts.moved}⇄`;
    filelistCounts.textContent = txt;
  }
}

filterDiffsOnly.addEventListener("change", () => renderFileList());
crossMatchToggle.addEventListener("change", () => refreshFolderDiff());

filelistRows.addEventListener("click", async (e) => {
  const row = e.target.closest(".file-row");
  if (!row) return;
  const path = row.dataset.path;
  const entry = state.folderEntries.find(x => x.path === path);
  if (!entry) return;
  await loadFolderEntry(entry);
});

async function loadFolderEntry(entry) {
  state.currentPath = entry.path;
  const sides = [
    ["left",  entry.leftEntry,  entry.leftPath  || entry.path],
    ["right", entry.rightEntry, entry.rightPath || entry.path],
  ];
  for (const [side, e, displayPath] of sides) {
    const root = state[side].dirName || "";
    if (e) {
      state[side].handle = e.handle || null;
      await readSideFile(side, e.handle || e.file, displayPath);
      setPathLabel(side, root + "/" + displayPath);
    } else {
      setMissingSide(side, displayPath);
      setPathLabel(side, root + "/" + displayPath + "  (missing)");
    }
  }
  renderFileList();
  recompute();
}

function exitFolderMode(side) {
  if (!side || side === "left") {
    state.left.dirHandle = null;
    state.left.dirName = null;
    state.left.fileMap = null;
  }
  if (!side || side === "right") {
    state.right.dirHandle = null;
    state.right.dirName = null;
    state.right.fileMap = null;
  }
  if (!state.left.fileMap && !state.right.fileMap) {
    state.folderEntries = [];
    state.currentPath = null;
    filelistEl.classList.add("hidden");
  }
}

function maybeHideFilelist() {
  if (!state.left.fileMap && !state.right.fileMap) {
    filelistEl.classList.add("hidden");
  }
}

document.getElementById("closeFolderMode").addEventListener("click", () => {
  exitFolderMode();
  filelistEl.classList.add("hidden");
  statusBar.textContent = "Folder mode closed.";
});

// Walk to subdirectory handle, creating intermediate dirs as needed.
async function descendDir(rootHandle, relPath) {
  const parts = relPath.split("/");
  const fileName = parts.pop();
  let dir = rootHandle;
  for (const part of parts) {
    dir = await dir.getDirectoryHandle(part, { create: true });
  }
  return { dir, fileName };
}

async function refreshOneEntryStatus(path) {
  const entry = state.folderEntries.find(e => e.path === path);
  if (!entry) return;
  try {
    entry.status = await compareEntries(entry.leftEntry, entry.rightEntry);
  } catch { entry.status = "differs"; }
  // Recompute counts
  const counts = { identical: 0, differs: 0, "only-left": 0, "only-right": 0 };
  for (const e of state.folderEntries) counts[e.status]++;
  renderFileList(counts);
}

async function saveSide(side) {
  const s = state[side];
  if (!s.name) {
    alert(`No ${side} file loaded.`);
    return;
  }
  if (s.binary) {
    alert(`Cannot save: ${side} is a binary file (text content was not loaded).`);
    return;
  }
  let content = s.lines.join("\n");
  if (s.trailingNL && s.lines.length) content += "\n";

  // 1. Direct handle (set when we opened the file via FSA, or by previous Save As)
  if (s.handle && s.handle.createWritable) {
    try {
      const writable = await s.handle.createWritable();
      await writable.write(content);
      await writable.close();
      statusBar.textContent = `Saved ${side} → ${s.name}`;
      if (state.currentPath) await refreshOneEntryStatus(state.currentPath);
      return;
    } catch (err) {
      console.warn("In-place save failed; falling back.", err);
    }
  }

  // 2. Folder mode with FSA directory handle: descend and write.
  //    Useful when we're saving a path that was "missing" on this side.
  if (s.dirHandle && state.currentPath) {
    try {
      const { dir, fileName } = await descendDir(s.dirHandle, state.currentPath);
      const fh = await dir.getFileHandle(fileName, { create: true });
      const writable = await fh.createWritable();
      await writable.write(content);
      await writable.close();
      s.handle = fh;
      // Register in fileMap so subsequent operations find it
      if (s.fileMap) s.fileMap.set(state.currentPath, { handle: fh, relPath: state.currentPath });
      statusBar.textContent = `Saved ${side} → ${s.dirName}/${state.currentPath}`;
      await refreshOneEntryStatus(state.currentPath);
      return;
    } catch (err) {
      console.warn("Folder-mode save failed; falling back.", err);
    }
  }

  // 3. Save As picker
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: s.name });
      const writable = await handle.createWritable();
      await writable.write(content);
      await writable.close();
      s.handle = handle;
      s.name = handle.name;
      setPathLabel(side, s.name);
      statusBar.textContent = `Saved ${side} → ${s.name}`;
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
      console.warn(err);
    }
  }

  // 4. Last resort: download
  const blob = new Blob([content], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = s.name.split("/").pop();
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  statusBar.textContent =
    `Downloaded ${a.download} (browser cannot overwrite original; replace it manually).`;
}

// ----- Open menus -----
function closeAllMenus() {
  document.querySelectorAll(".menu.open").forEach(m => m.classList.remove("open"));
}
document.querySelectorAll("[data-menu]").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const menu = document.getElementById(btn.dataset.menu);
    const wasOpen = menu.classList.contains("open");
    closeAllMenus();
    if (!wasOpen) menu.classList.add("open");
  });
});
document.querySelectorAll(".menu button").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    closeAllMenus();
    const side = btn.dataset.side;
    if (btn.dataset.kind === "folder") pickAndLoadFolder(side);
    else                                pickAndLoad(side);
  });
});
document.addEventListener("click", closeAllMenus);

document.getElementById("saveLeft").addEventListener("click", () => saveSide("left"));
document.getElementById("saveRight").addEventListener("click", () => saveSide("right"));
document.getElementById("refresh").addEventListener("click", () => {
  if (state.left.fileMap || state.right.fileMap) refreshFolderDiff();
  else recompute();
});

// ----- Drag & drop -----
let dragDepth = 0;
document.addEventListener("dragenter", (e) => {
  e.preventDefault();
  dragDepth++;
  dropOverlay.classList.add("show");
});
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("dragleave", () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) dropOverlay.classList.remove("show");
});
document.addEventListener("drop", async (e) => {
  e.preventDefault();
  dragDepth = 0;
  dropOverlay.classList.remove("show");

  const items = Array.from(e.dataTransfer.items || []).slice(0, 2);
  const entries = items.map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);

  if (entries.some(en => en && en.isDirectory)) {
    // Folder drop — walk each entry into a fileMap.
    for (let i = 0; i < entries.length; i++) {
      const side = i === 0 ? "left" : "right";
      const en = entries[i];
      if (en.isDirectory) {
        const fileMap = new Map();
        await walkWebkitDir(en, "", fileMap);
        state[side].dirHandle = null;
        state[side].dirName = en.name;
        state[side].fileMap = fileMap;
        setPathLabel(side, en.name + "/");
      } else {
        const file = await new Promise((r, j) => en.file(r, j));
        const text = await file.text();
        const parsed = parseContent(text);
        state[side].name = file.name;
        state[side].lines = parsed.lines;
        state[side].trailingNL = parsed.trailingNL;
        state[side].handle = null;
        state[side].fileMap = null;
        state[side].dirHandle = null;
        state[side].dirName = null;
        setPathLabel(side, file.name);
      }
    }
    await refreshFolderDiff();
    return;
  }

  // File drop (one or two files)
  const files = Array.from(e.dataTransfer.files).slice(0, 2);
  for (let i = 0; i < files.length; i++) {
    const side = i === 0 ? "left" : "right";
    exitFolderMode(side);
    state[side].handle = null;
    await readSideFile(side, files[i], files[i].name);
    setPathLabel(side, files[i].name);
  }
  maybeHideFilelist();
  recompute();
});

async function walkWebkitDir(dirEntry, prefix, out) {
  const reader = dirEntry.createReader();
  const all = [];
  while (true) {
    const batch = await new Promise((r, j) => reader.readEntries(r, j));
    if (!batch.length) break;
    all.push(...batch);
  }
  for (const child of all) {
    if (child.name.startsWith(".")) continue;
    const path = prefix ? prefix + "/" + child.name : child.name;
    if (child.isDirectory) {
      await walkWebkitDir(child, path, out);
    } else {
      const file = await new Promise((r, j) => child.file(r, j));
      out.set(path, { file, relPath: path });
    }
  }
}

// ----- Keyboard shortcuts -----
document.addEventListener("keydown", (e) => {
  if (e.key === "F8" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("nextDiff").click();
  } else if (e.key === "F8" && e.shiftKey) {
    e.preventDefault();
    document.getElementById("prevDiff").click();
  } else if ((e.ctrlKey || e.metaKey) && e.key === "s" && !e.shiftKey) {
    e.preventDefault();
    saveSide("left");
  } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "S") {
    e.preventDefault();
    saveSide("right");
  }
});

// Initial render (empty)
recompute();
</script>
